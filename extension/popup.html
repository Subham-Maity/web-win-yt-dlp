<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>yt-dlp BullMQ Bridge</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0b0d13;
      color: #f1f5f9;
    }
    h3 {
      margin: 0 0 6px 0;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #131722;
      border: 1px solid #2a334a;
      margin-bottom: 12px;
      color: #94a3b8;
    }
    .status.ok {
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    .status.err {
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.92; }
    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #10b981);
      color: #06131a;
    }
    .btn-ghost {
      background: #1a2030;
      color: #e2e8f0;
      border: 1px solid #2a334a;
    }
    #msg {
      font-size: 11.5px;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h3>🌐 yt-dlp Webpage Bridge</h3>
  <div id="statusBox" class="status">Checking localhost:3456...</div>
  <button class="btn-primary" id="btnScanTab">🔍 Scan Current Tab → Send to UI</button>
  <button class="btn-ghost" id="btnOpenUi">🚀 Open Downloader Web UI</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
